server {
    listen 80;
    server_name _;

    # ── Arquivos estáticos do Angular (build de produção) ──
    root /var/www/sorteio;
    index index.html;

    # Angular SPA: qualquer rota que não seja arquivo real → index.html
    # Isso permite que o Angular Router trate /login, /cadastro, /sorteio
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy reverso: encaminha /api/* para o Spring Boot ──
    location /api/ {
        proxy_pass http://10.20.30.2:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necessário para o cookie JSESSIONID funcionar corretamente
        proxy_cookie_path / /;
    }
}
